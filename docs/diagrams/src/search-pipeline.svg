<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" role="img">
<title>Nido: from a request to a ranked shortlist</title>
<desc>The Find filters (POST /api/search) and the agent's find_titles tool both call Toolbox.search. It cleans regions and genres, reads TMDB discover pages per region until 30 titles pass the age and availability rules, reads each title's details and offers, adds IMDb scores from OMDb only for eligible titles, scores them in shortlist, falls back to near_misses when nothing fits, and presents each result as a sourced card. TMDB and OMDb answers go through the Firestore cache.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-teal">
<rect x="55" y="30" width="165" height="56" rx="8"/>
<text class="tm" x="137" y="49" text-anchor="middle" dominant-baseline="central">/api/search</text>
<text class="ts" x="137" y="68" text-anchor="middle" dominant-baseline="central">Find filters</text>
</g>
<g class="s-purple">
<rect x="245" y="30" width="165" height="56" rx="8"/>
<text class="tm" x="327" y="49" text-anchor="middle" dominant-baseline="central">find_titles</text>
<text class="ts" x="327" y="68" text-anchor="middle" dominant-baseline="central">profile as the floor</text>
</g>

<g class="ct-purple">
<rect x="30" y="120" width="590" height="380" rx="16"/>
<text class="th" x="52" y="146" dominant-baseline="central">Toolbox.search</text>
<text class="ts" x="52" y="165" dominant-baseline="central">no model call</text>
</g>

<g class="n-purple">
<rect x="55" y="190" width="165" height="56" rx="8"/>
<text class="tm" x="137" y="209" text-anchor="middle" dominant-baseline="central">clean_regions</text>
<text class="ts" x="137" y="228" text-anchor="middle" dominant-baseline="central">regions, genres, profile</text>
</g>
<g class="n-purple">
<rect x="245" y="190" width="165" height="56" rx="8"/>
<text class="tm" x="327" y="209" text-anchor="middle" dominant-baseline="central">_pool</text>
<text class="ts" x="327" y="228" text-anchor="middle" dominant-baseline="central">skips banned titles</text>
</g>
<g class="n-purple">
<rect x="435" y="190" width="165" height="56" rx="8"/>
<text class="tm" x="517" y="209" text-anchor="middle" dominant-baseline="central">_candidate</text>
<text class="ts" x="517" y="228" text-anchor="middle" dominant-baseline="central">details and offers</text>
</g>

<g class="n-purple">
<rect x="435" y="300" width="165" height="56" rx="8"/>
<text class="tm" x="517" y="319" text-anchor="middle" dominant-baseline="central">_rate</text>
<text class="ts" x="517" y="338" text-anchor="middle" dominant-baseline="central">IMDb, eligible only</text>
</g>
<g class="n-purple">
<rect x="245" y="300" width="165" height="56" rx="8"/>
<text class="tm" x="327" y="319" text-anchor="middle" dominant-baseline="central">shortlist</text>
<text class="ts" x="327" y="338" text-anchor="middle" dominant-baseline="central">score, top 20</text>
</g>
<g class="n-purple">
<rect x="55" y="300" width="165" height="56" rx="8"/>
<text class="tm" x="137" y="319" text-anchor="middle" dominant-baseline="central">near_misses</text>
<text class="ts" x="137" y="338" text-anchor="middle" dominant-baseline="central">only if none fit</text>
</g>

<g class="n-purple">
<rect x="245" y="420" width="165" height="56" rx="8"/>
<text class="tm" x="327" y="439" text-anchor="middle" dominant-baseline="central">_present</text>
<text class="ts" x="327" y="458" text-anchor="middle" dominant-baseline="central">cards with sources</text>
</g>

<g class="s-gray">
<rect x="700" y="190" width="150" height="56" rx="8"/>
<text class="th" x="775" y="209" text-anchor="middle" dominant-baseline="central">TMDB</text>
<text class="ts" x="775" y="228" text-anchor="middle" dominant-baseline="central">+ JustWatch offers</text>
</g>
<g class="s-gray">
<rect x="700" y="300" width="150" height="56" rx="8"/>
<text class="th" x="775" y="319" text-anchor="middle" dominant-baseline="central">OMDb</text>
<text class="ts" x="775" y="338" text-anchor="middle" dominant-baseline="central">IMDb ratings</text>
</g>

<path class="arr" d="M185 86 V188" marker-end="url(#a)"/>
<path class="arr" d="M327 86 V104 H205 V188" marker-end="url(#a)"/>
<path class="arr" d="M220 218 H243" marker-end="url(#a)"/>
<path class="arr" d="M410 218 H433" marker-end="url(#a)"/>
<path class="arr" d="M517 246 V298" marker-end="url(#a)"/>
<path class="arr" d="M435 328 H412" marker-end="url(#a)"/>
<path class="arr" d="M245 328 H222" marker-end="url(#a)"/>
<path class="arr" d="M327 356 V418" marker-end="url(#a)"/>
<path class="arr" d="M137 356 V448 H243" marker-end="url(#a)"/>
<path class="arr" d="M600 218 H698" marker-end="url(#a)"/>
<text class="ts" x="627" y="206" dominant-baseline="central">1-day cache</text>
<path class="arr" d="M600 328 H698" marker-end="url(#a)"/>
<text class="ts" x="627" y="316" dominant-baseline="central">7-day cache</text>
</svg>
