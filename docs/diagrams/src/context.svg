<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" role="img">
<title>Nido system context (C4 level 1)</title>
<desc>A parent sets up the family profile and asks Nido what to watch; family members join by invite and share the profile and watchlist. Nido checks Google sign-in through Firebase Auth, reads titles, official ratings and streaming offers from TMDB with JustWatch data, IMDb scores from OMDb, and asks Gemini to turn requests into search criteria.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-gray">
<rect x="170" y="30" width="240" height="64" rx="32"/>
<text class="th" x="290" y="52" text-anchor="middle" dominant-baseline="central">Parent</text>
<text class="ts" x="290" y="72" text-anchor="middle" dominant-baseline="central">sets the family profile</text>
</g>
<g class="s-gray">
<rect x="470" y="30" width="240" height="64" rx="32"/>
<text class="th" x="590" y="52" text-anchor="middle" dominant-baseline="central">Family member</text>
<text class="ts" x="590" y="72" text-anchor="middle" dominant-baseline="central">joins by invite link</text>
</g>

<g class="s-purple">
<rect x="110" y="170" width="660" height="90" rx="10"/>
<text class="th" x="440" y="194" text-anchor="middle" dominant-baseline="central">Nido</text>
<text class="ts" x="440" y="220" text-anchor="middle" dominant-baseline="central">age-checked movies and series</text>
<text class="ts" x="440" y="238" text-anchor="middle" dominant-baseline="central">on the family's own services</text>
</g>

<path class="arr" d="M290 94 V168" marker-end="url(#a)"/>
<text class="ts" x="280" y="131" text-anchor="end" dominant-baseline="central">asks what to watch</text>
<path class="arr" d="M590 94 V168" marker-end="url(#a)"/>
<text class="ts" x="600" y="131" dominant-baseline="central">shares watchlist, marks</text>

<g class="s-gray">
<rect x="30" y="360" width="190" height="64" rx="10"/>
<text class="th" x="125" y="382" text-anchor="middle" dominant-baseline="central">Firebase Auth</text>
<text class="ts" x="125" y="402" text-anchor="middle" dominant-baseline="central">Google sign-in</text>
</g>
<g class="s-coral dash">
<rect x="240" y="360" width="190" height="64" rx="10"/>
<text class="th" x="335" y="382" text-anchor="middle" dominant-baseline="central">Gemini API</text>
<text class="ts" x="335" y="402" text-anchor="middle" dominant-baseline="central">AI Studio, Flash-Lite</text>
</g>
<g class="s-gray">
<rect x="450" y="360" width="190" height="64" rx="10"/>
<text class="th" x="545" y="382" text-anchor="middle" dominant-baseline="central">TMDB</text>
<text class="ts" x="545" y="402" text-anchor="middle" dominant-baseline="central">+ JustWatch availability</text>
</g>
<g class="s-gray">
<rect x="660" y="360" width="190" height="64" rx="10"/>
<text class="th" x="755" y="382" text-anchor="middle" dominant-baseline="central">OMDb</text>
<text class="ts" x="755" y="402" text-anchor="middle" dominant-baseline="central">IMDb ratings</text>
</g>

<path class="arr" d="M125 260 V358" marker-end="url(#a)"/>
<text class="ts" x="135" y="310" dominant-baseline="central">checks ID tokens</text>
<path class="arr llm e-coral" d="M335 260 V358" marker-end="url(#al)"/>
<text class="ts" x="345" y="310" dominant-baseline="central">proposes search criteria</text>
<path class="arr" d="M545 260 V358" marker-end="url(#a)"/>
<text class="ts" x="555" y="310" dominant-baseline="central">titles, ratings, offers</text>
<path class="arr" d="M755 260 V358" marker-end="url(#a)"/>
<text class="ts" x="765" y="310" dominant-baseline="central">IMDb scores</text>
</svg>
