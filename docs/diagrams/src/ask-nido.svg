<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" role="img">
<title>Nido: one Ask Nido turn</title>
<desc>POST /api/chat takes one turn from the family's daily quota, writes the saved profile, its limits and the banned titles into session state, and runs the ADK agent nido_agent, which calls Gemini and the find_titles or look_up_title tools. The reply loses unknown links in safe_links, chat_cards orders the cards by the titles the reply names, with_marks attaches the family's marks, and Finder.tsx renders the reply and the cards.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-gray">
<rect x="110" y="30" width="170" height="56" rx="28"/>
<text class="th" x="195" y="49" text-anchor="middle" dominant-baseline="central">Parent</text>
<text class="ts" x="195" y="68" text-anchor="middle" dominant-baseline="central">asks in plain words</text>
</g>
<g class="s-coral dash">
<rect x="450" y="30" width="170" height="56" rx="8"/>
<text class="th" x="535" y="49" text-anchor="middle" dominant-baseline="central">Gemini</text>
<text class="ts" x="535" y="68" text-anchor="middle" dominant-baseline="central">Flash-Lite, fallback</text>
</g>
<g class="s-gray">
<rect x="660" y="30" width="170" height="56" rx="8"/>
<text class="th" x="745" y="49" text-anchor="middle" dominant-baseline="central">TMDB · OMDb</text>
<text class="ts" x="745" y="68" text-anchor="middle" dominant-baseline="central">via Firestore cache</text>
</g>

<g class="ct-purple">
<rect x="30" y="120" width="820" height="270" rx="16"/>
<text class="th" x="52" y="146" dominant-baseline="central">Ask Nido turn</text>
<text class="ts" x="52" y="165" dominant-baseline="central">POST /api/chat</text>
</g>

<g class="n-purple">
<rect x="50" y="190" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="209" text-anchor="middle" dominant-baseline="central">take_quota</text>
<text class="ts" x="135" y="228" text-anchor="middle" dominant-baseline="central">40 turns a day</text>
</g>
<g class="n-purple">
<rect x="250" y="190" width="170" height="56" rx="8"/>
<text class="tm" x="335" y="209" text-anchor="middle" dominant-baseline="central">state_delta</text>
<text class="ts" x="335" y="228" text-anchor="middle" dominant-baseline="central">profile, guard, banned</text>
</g>
<g class="n-purple">
<rect x="450" y="190" width="170" height="56" rx="8"/>
<text class="tm" x="535" y="209" text-anchor="middle" dominant-baseline="central">nido_agent</text>
<text class="ts" x="535" y="228" text-anchor="middle" dominant-baseline="central">≤ 8 model calls</text>
</g>
<g class="n-purple">
<rect x="660" y="190" width="170" height="56" rx="8"/>
<text class="tm" x="745" y="209" text-anchor="middle" dominant-baseline="central">find_titles</text>
<text class="ts" x="745" y="228" text-anchor="middle" dominant-baseline="central">or look_up_title</text>
</g>

<g class="n-purple">
<rect x="450" y="300" width="170" height="56" rx="8"/>
<text class="tm" x="535" y="319" text-anchor="middle" dominant-baseline="central">safe_links</text>
<text class="ts" x="535" y="338" text-anchor="middle" dominant-baseline="central">drops unknown links</text>
</g>
<g class="n-purple">
<rect x="250" y="300" width="170" height="56" rx="8"/>
<text class="tm" x="335" y="319" text-anchor="middle" dominant-baseline="central">chat_cards</text>
<text class="ts" x="335" y="338" text-anchor="middle" dominant-baseline="central">named titles first</text>
</g>
<g class="n-purple">
<rect x="50" y="300" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="319" text-anchor="middle" dominant-baseline="central">with_marks</text>
<text class="ts" x="135" y="338" text-anchor="middle" dominant-baseline="central">family marks attached</text>
</g>

<g class="s-teal">
<rect x="50" y="424" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="443" text-anchor="middle" dominant-baseline="central">Finder.tsx</text>
<text class="ts" x="135" y="462" text-anchor="middle" dominant-baseline="central">reply and title cards</text>
</g>

<path class="arr" d="M195 86 V188" marker-end="url(#a)"/>
<path class="arr" d="M220 218 H248" marker-end="url(#a)"/>
<path class="arr" d="M420 218 H448" marker-end="url(#a)"/>
<path class="arr" d="M622 218 H658" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="arr llm e-coral" d="M535 190 V88" marker-end="url(#al)"/>
<path class="arr" d="M745 190 V88" marker-end="url(#a)"/>
<path class="arr" d="M535 246 V298" marker-end="url(#a)"/>
<path class="arr" d="M450 328 H422" marker-end="url(#a)"/>
<path class="arr" d="M250 328 H222" marker-end="url(#a)"/>
<path class="arr" d="M135 356 V422" marker-end="url(#a)"/>
</svg>
