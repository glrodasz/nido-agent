<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" role="img">
<title>Nido containers: what runs where (C4 level 2)</title>
<desc>The family's browser loads the static web app from Firebase Hosting and signs in with Firebase Auth. Hosting rewrites /api/** to the Cloud Run service nido-api, which keeps profiles, quotas and the API cache in Firestore, reads its keys from Secret Manager, and calls Gemini, TMDB and OMDb.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-gray">
<rect x="260" y="30" width="240" height="64" rx="32"/>
<text class="th" x="380" y="52" text-anchor="middle" dominant-baseline="central">Family</text>
<text class="ts" x="380" y="72" text-anchor="middle" dominant-baseline="central">browser, Google account</text>
</g>

<g class="ct-teal">
<rect x="30" y="124" width="820" height="116" rx="16"/>
<text class="th" x="52" y="150" dominant-baseline="central">Firebase</text>
<text class="ts" x="52" y="169" dominant-baseline="central">hosting and sign-in</text>
</g>
<g class="n-teal">
<rect x="270" y="164" width="220" height="56" rx="8"/>
<text class="th" x="380" y="183" text-anchor="middle" dominant-baseline="central">Firebase Hosting</text>
<text class="ts" x="380" y="202" text-anchor="middle" dominant-baseline="central">Astro + Preact, static</text>
</g>
<g class="n-teal">
<rect x="600" y="164" width="220" height="56" rx="8"/>
<text class="th" x="710" y="183" text-anchor="middle" dominant-baseline="central">Firebase Auth</text>
<text class="ts" x="710" y="202" text-anchor="middle" dominant-baseline="central">Google sign-in</text>
</g>
<path class="arr" d="M380 94 V162" marker-end="url(#a)"/>
<path class="arr" d="M500 62 H710 V162" marker-end="url(#a)"/>

<g class="ct-purple">
<rect x="30" y="280" width="600" height="250" rx="16"/>
<text class="th" x="52" y="306" dominant-baseline="central">Google Cloud</text>
<text class="ts" x="52" y="325" dominant-baseline="central">europe-north1</text>
</g>
<g class="n-purple">
<rect x="270" y="350" width="220" height="56" rx="8"/>
<text class="tm" x="380" y="369" text-anchor="middle" dominant-baseline="central">nido-api</text>
<text class="ts" x="380" y="388" text-anchor="middle" dominant-baseline="central">Cloud Run, FastAPI + ADK</text>
</g>
<g class="n-purple">
<rect x="60" y="450" width="180" height="56" rx="8"/>
<text class="th" x="150" y="469" text-anchor="middle" dominant-baseline="central">Secret Manager</text>
<text class="ts" x="150" y="488" text-anchor="middle" dominant-baseline="central">API keys</text>
</g>
<g class="n-purple">
<rect x="270" y="450" width="220" height="56" rx="8"/>
<text class="th" x="380" y="469" text-anchor="middle" dominant-baseline="central">Firestore</text>
<text class="ts" x="380" y="488" text-anchor="middle" dominant-baseline="central">families, usage, cache</text>
</g>
<path class="arr" d="M380 220 V348" marker-end="url(#a)"/>
<text class="ts" x="390" y="260" dominant-baseline="central">/api/** rewrite</text>
<path class="arr" d="M380 406 V448" marker-end="url(#a)"/>
<path class="arr" d="M270 378 H150 V448" marker-end="url(#a)"/>

<g class="s-coral dash">
<rect x="670" y="340" width="180" height="50" rx="8"/>
<text class="th" x="760" y="357" text-anchor="middle" dominant-baseline="central">Gemini API</text>
<text class="ts" x="760" y="375" text-anchor="middle" dominant-baseline="central">Ask Nido only</text>
</g>
<g class="s-gray">
<rect x="670" y="410" width="180" height="50" rx="8"/>
<text class="th" x="760" y="427" text-anchor="middle" dominant-baseline="central">TMDB</text>
<text class="ts" x="760" y="445" text-anchor="middle" dominant-baseline="central">+ JustWatch offers</text>
</g>
<g class="s-gray">
<rect x="670" y="480" width="180" height="50" rx="8"/>
<text class="th" x="760" y="497" text-anchor="middle" dominant-baseline="central">OMDb</text>
<text class="ts" x="760" y="515" text-anchor="middle" dominant-baseline="central">IMDb ratings</text>
</g>
<path class="arr llm e-coral" d="M490 365 H668" marker-end="url(#al)"/>
<path class="arr" d="M490 380 H580 V435 H668" marker-end="url(#a)"/>
<path class="arr" d="M490 395 H560 V505 H668" marker-end="url(#a)"/>
</svg>
