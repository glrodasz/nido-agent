<title>Nido system context (C4 level 1)</title>
<desc>A parent sets up the family profile and asks Nido what to watch; family members join by invite and share the profile and watchlist. Nido checks Google sign-in through Firebase Auth, reads titles, official ratings and streaming offers from TMDB with JustWatch data, IMDb scores from OMDb, and asks Gemini to turn requests into search criteria.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-gray">
