<text class="ts" x="545" y="402" text-anchor="middle" dominant-baseline="central">+ JustWatch availability</text>
</g>
<g class="s-gray">
<rect x="660" y="360" width="190" height="64" rx="10"/>
<text class="th" x="755" y="382" text-anchor="middle" dominant-baseline="central">OMDb</text>
<text class="ts" x="755" y="402" text-anchor="middle" dominant-baseline="central">IMDb ratings</text>
</g>

