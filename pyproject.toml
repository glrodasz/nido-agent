[project]
name = "nido"
version = "0.1.0"
description = "Family entertainment curator agent built with Google ADK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "google-adk==2.11.0",
  "google-auth>=2.30",
  "google-cloud-firestore>=2.19",
  "httpx>=0.27",
  "pydantic>=2.11",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[project.scripts]
nido = "nido.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nido"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning:google.*",
  "ignore:.*EXPERIMENTAL.*:UserWarning",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
